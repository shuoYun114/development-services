name: 提交付费需求 / Service request
description: Android / Kotlin 构建排错或小修复；提交不代表订单已成立。
title: "[需求] "
body:
  - type: markdown
    attributes:
      value: "作者：烁云辉霞。此处为公开页面，请勿上传任何密钥、私有源码、客户数据或设备标识。"
  - type: textarea
    id: problem
    attributes:
      label: 期望与实际结果
      description: 写清一个希望解决的问题。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤与脱敏日志
      description: 如无法公开提供源码，仅描述情况，后续另行约定材料渠道。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境版本
      placeholder: Android / Gradle / Kotlin / JDK
  - type: input
    id: budget
    attributes:
      label: 预算与期望时间
  - type: checkboxes
    id: privacy
    attributes:
      label: 信息检查
      options:
        - label: 我确认未在此提交敏感信息，并理解报价及范围需要另行确认。
          required: true
